name: Feature request
description: Suggest a change or a new feature.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. codexpool keeps a few rules that shape what it can do: nothing custom in the seat request path, a minimal Codex config, tokens never copied or printed, a loopback-only gated pool, and a menu bar app that only reads files. [AGENTS.md](https://github.com/memfactorduke/codex-load-balancer/blob/main/AGENTS.md#invariants-never-break-these) lists them all.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work, from your side. Commands, settings, or what the menu bar or Settings window would show.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you use now, or other ways to solve it.
    validations:
      required: false
  - type: checkboxes
    id: rules
    attributes:
      label: Checks
      options:
        - label: I searched the open and closed issues for this idea.
          required: true
        - label: As far as I can tell, this fits the invariants in AGENTS.md (or I explain above why one should change).
          required: false
