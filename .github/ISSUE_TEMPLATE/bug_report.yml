name: Bug report
description: Something in codexpool doesn't work as the docs say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. First run `codexpool doctor`: it checks the whole setup and often names the fix.
        [Troubleshooting](https://github.com/memfactorduke/codex-load-balancer/blob/main/docs/TROUBLESHOOTING.md) covers the common problems.

        **Remove personal data before you post:** emails, account and workspace ids, seat names you would rather keep private, and your macOS user name in paths. Never paste tokens or the contents of `~/.codexpool/auth/`.
        A security problem goes to a [private report](https://github.com/memfactorduke/codex-load-balancer/security/advisories/new), not here (if that page shows no form, open a Security contact request instead).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        I ran codexpool reset "Work A" and expected ..., but ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: doctor
    attributes:
      label: codexpool doctor output
      description: The full output of `codexpool doctor`, with personal data removed. It is pasted as-is.
      render: text
    validations:
      required: true
  - type: input
    id: codexpool-version
    attributes:
      label: codexpool version
      description: "`codexpool version`, the release you installed, or the commit."
      placeholder: codexpool 1.0.0
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version and Mac
      description: From the Apple menu, About This Mac.
      placeholder: macOS 15.3, Apple silicon
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex app version
      description: From the Codex app's About window. Add the `codex --version` output if the problem is in the CLI.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: |
        The relevant lines of `codexpool logs -n 50` or `codexpool logs --guard -n 50`, or a screenshot. Remove personal data first.
      render: text
    validations:
      required: false
