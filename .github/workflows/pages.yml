# Deploys the static site in site/ to GitHub Pages. There is no build step: the folder is the site.
# Going live is two one-time steps (until then pushes skip this job instead of failing it):
#   1. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   2. Settings -> Secrets and variables -> Actions -> Variables: PAGES_ENABLED = true
#      (or: gh variable set PAGES_ENABLED --body true). A manual run (workflow_dispatch) always deploys.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish rather than cancel it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site/
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
